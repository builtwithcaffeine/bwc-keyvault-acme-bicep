name: Update Acmebot Function App

on:
  workflow_dispatch:
    inputs:
      subscriptionId:
        description: 'Azure Subscription Id:'
        required: true
        type: string
      resourceGroupName:
        description: 'Resource Group Name:'
        required: true
        type: string
      functionAppName:
        description: 'Function App Name:'
        required: true
        type: string
      version:
        description: "Acmebot version to deploy (e.g. 5.0.0)."
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

env:
  PARAM_FILE: infra/create/param.main.bicepparam
  UPDATE_TEMPLATE: infra/update/main.bicep
  ACMEBOT_REPO: polymind-inc/acmebot

jobs:
  update-function-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target version
        id: version
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.version }}" ]; then
            resolved=$(grep -oP "(?<=^param acmebotReleaseTag = ')[^']+" "$PARAM_FILE")
            if [[ -z "$resolved" ]]; then
              echo "::error::Could not resolve acmebotReleaseTag from ${PARAM_FILE}"
              exit 1
            fi
            echo "Resolved empty input to pinned version: ${resolved}"
          else
            resolved="${{ inputs.version }}"
            echo "Using explicitly provided version: ${resolved}"
          fi
          echo "version=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Validate requested Acmebot version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == "latest" ]]; then
            echo "Version 'latest' requires no further validation."
            exit 0
          fi

          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not a valid Acmebot version. Expected 'latest' or a semver value such as '5.0.0' or 'v5.0.0'."
            exit 1
          fi

          tag="$VERSION"
          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi

          if ! gh api "repos/${ACMEBOT_REPO}/releases/tags/${tag}" --jq '.tag_name' >/dev/null 2>&1; then
            echo "::error::Release '${tag}' was not found in ${ACMEBOT_REPO}. Check https://github.com/${ACMEBOT_REPO}/releases for valid versions."
            exit 1
          fi

          echo "Confirmed release '${tag}' exists in ${ACMEBOT_REPO}."

      - name: Azure Login (OIDC federated)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscriptionId }}

      - name: Check Function App status & resolve resource group
        id: preflight
        run: |
          set -euo pipefail
          resourceGroup="${{ inputs.resourceGroupName }}"

          state=$(az functionapp show --subscription "${{ inputs.subscriptionId }}" --resource-group "$resourceGroup" --name "${{ inputs.functionAppName }}" --query "state" --output tsv)
          hostName=$(az functionapp show --subscription "${{ inputs.subscriptionId }}" --resource-group "$resourceGroup" --name "${{ inputs.functionAppName }}" --query "defaultHostName" --output tsv)

          echo "Function App '${{ inputs.functionAppName }}' found in resource group '${resourceGroup}' (state: ${state})"

          echo "resourceGroup=${resourceGroup}" >> "$GITHUB_OUTPUT"
          echo "preDeployState=${state}" >> "$GITHUB_OUTPUT"
          echo "hostName=${hostName}" >> "$GITHUB_OUTPUT"

      - name: Run update deployment
        id: deploy
        run: |
          set -euo pipefail
          az deployment group create \
            --subscription "${{ inputs.subscriptionId }}" \
            --resource-group "${{ steps.preflight.outputs.resourceGroup }}" \
            --template-file "$UPDATE_TEMPLATE" \
            --parameters functionAppName="${{ inputs.functionAppName }}" acmebotReleaseTag="${{ steps.version.outputs.version }}" \
            --name "acmebot-update-${{ steps.version.outputs.version }}-${{ github.run_id }}"

      - name: Wait for Function App to come back online
        id: wait
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state=$(az functionapp show --subscription "${{ inputs.subscriptionId }}" --resource-group "${{ steps.preflight.outputs.resourceGroup }}" --name "${{ inputs.functionAppName }}" --query "state" --output tsv)
            echo "Attempt ${attempt}/30: Function App state = ${state}"
            if [ "$state" = "Running" ]; then
              echo "postDeployState=${state}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$state" ]; then
              echo "Function App state is not reported by the Flex Consumption API; continuing to smoke test."
              echo "postDeployState=Not reported (Flex Consumption)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Function App did not reach 'Running' state within the timeout window."
          exit 1

      - name: Report
        if: always()
        run: |
          {
            echo "## Acmebot Function App Update"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Function App | ${{ inputs.functionAppName }} |"
            echo "| Subscription | ${{ inputs.subscriptionId }} |"
            echo "| Resource Group | ${{ steps.preflight.outputs.resourceGroup }} |"
            echo "| Requested Version | ${{ inputs.version }} |"
            echo "| Deployed Version | ${{ steps.version.outputs.version }} |"
            echo "| State Before | ${{ steps.preflight.outputs.preDeployState }} |"
            echo "| State After | ${{ steps.wait.outputs.postDeployState }} |"
            echo "| Deployment Job | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
