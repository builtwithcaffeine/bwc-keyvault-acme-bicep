name: Check Acmebot Release

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    types: [closed]

concurrency:
  group: check-acmebot-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  ACMEBOT_REPO: polymind-inc/acmebot
  PARAM_FILE: infra/create/param.main.bicepparam

jobs:
  check-acmebot-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest Acmebot release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${ACMEBOT_REPO}/releases/latest" --jq '.tag_name')
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected or empty tag_name from GitHub API: '${tag}'"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Get current pinned version
        id: current
        run: |
          set -euo pipefail
          current=$(grep -oP "(?<=^param acmebotReleaseTag = ')[^']+" "$PARAM_FILE")
          if [[ -z "$current" ]]; then
            echo "::error::Could not find acmebotReleaseTag in ${PARAM_FILE}"
            exit 1
          fi
          echo "version=${current}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.latest.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update bicepparam file
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^param acmebotReleaseTag = '${{ steps.current.outputs.version }}'$/param acmebotReleaseTag = '${{ steps.latest.outputs.version }}'/" "$PARAM_FILE"
          grep -qF "param acmebotReleaseTag = '${{ steps.latest.outputs.version }}'" "$PARAM_FILE"

      - name: Update changelog
        if: steps.compare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
          FROM_VERSION: ${{ steps.current.outputs.version }}
          TO_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          entryfile=$(mktemp)
          {
            printf '## %s - %s\n\n' "$RELEASE_TAG" "$(date -u +%Y-%m-%d)"
            printf -- '- Bumped `acmebotReleaseTag` from `%s` to `%s`.\n' "$FROM_VERSION" "$TO_VERSION"
            printf -- '- [Release notes](https://github.com/%s/releases/tag/%s)\n\n\n' "$ACMEBOT_REPO" "$RELEASE_TAG"
          } > "$entryfile"
          # Insert above the newest existing release heading rather than at a fixed line offset
          tmpfile=$(mktemp)
          awk -v entryfile="$entryfile" '
            function emit_entry(   line) {
              while ((getline line < entryfile) > 0) print line
              close(entryfile)
              inserted = 1
            }
            !inserted && /^## / { emit_entry() }
            { print }
            END { if (!inserted) emit_entry() }
          ' CHANGELOG.md > "$tmpfile"
          mv "$tmpfile" CHANGELOG.md
          grep -qF "## ${RELEASE_TAG} - " CHANGELOG.md

      - name: Setup Bicep CLI
        if: steps.compare.outputs.changed == 'true'
        run: az bicep install

      - name: Build & validate Bicep templates
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          az bicep build --file infra/create/main.bicep --outfile /tmp/create.main.json
          echo "✅ infra/create/main.bicep built successfully"
          az bicep build --file infra/update/main.bicep --outfile /tmp/update.main.json
          echo "✅ infra/update/main.bicep built successfully"

      - name: Create pull request
        if: steps.compare.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[GitHub Bot]: bump acmebotReleaseTag to ${{ steps.latest.outputs.version }}"
          title: "[GitHub Bot]: bump Acmebot release to ${{ steps.latest.outputs.tag }}"
          body: |
            A new Acmebot release was published: [${{ steps.latest.outputs.tag }}](https://github.com/${{ env.ACMEBOT_REPO }}/releases/tag/${{ steps.latest.outputs.tag }})

            This PR updates the pinned `acmebotReleaseTag` in `${{ env.PARAM_FILE }}` from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            `CHANGELOG.md` has been updated with this release entry.

            The Bicep templates were successfully built against this version, so this PR will auto-merge once required checks pass.
          branch: update/acmebot-${{ steps.latest.outputs.version }}
          delete-branch: true
          labels: dependencies
          reviewers: smoonlee

      - name: Enable auto-merge
        if: steps.compare.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"

      - name: Generate approval token
        # A dedicated GitHub App (installed on this repo) provides a bot identity distinct
        # from github-actions[bot], since GitHub blocks an actor from approving its own PR.
        if: steps.compare.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_APPROVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APPROVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Auto-approve pull request
        if: steps.compare.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr review "${{ steps.cpr.outputs.pull-request-number }}" --approve --repo "${{ github.repository }}"

  delete-merged-acmebot-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'update/acmebot-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged Acmebot branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Deleted merged branch: ${BRANCH}"
